<main class="calculator-page">
  <section class="calculator" aria-labelledby="calculator-title">
    <div class="intro">
      <p class="eyebrow">Kuno mases indeksas</p>
      <h1 id="calculator-title">KMI skaiciuokle</h1>
      <p>KMI = kuno mase (kg) / ugis (m)<sup>2</sup></p>
    </div>

    <form class="calculator-form">
      <label>
        Svoris (kg.)
        <input
          type="number"
          name="weight"
          min="1"
          step="0.1"
          placeholder="Pvz. 72"
          [ngModel]="weight()"
          (ngModelChange)="weight.set($event)"
        />
      </label>

      <label>
        Ugis (cm.)
        <input
          type="number"
          name="height"
          min="1"
          step="0.1"
          placeholder="Pvz. 178"
          [ngModel]="height()"
          (ngModelChange)="height.set($event)"
        />
      </label>
    </form>

    <section class="result" aria-live="polite">
      <span>Jusu KMI</span>
      <strong>{{ formattedBmi() }}</strong>
    </section>
  </section>
</main>
